[package]
name = "mcgm"
version = "1.0.0"
edition = "2021"
authors = ["andreyabr"]
description = "Minecraft to Garry's Mod map and physics exporter"

[dependencies]
rayon = "1.10"
fastnbt = "2.5"
flate2 = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwinding panics (not abort) so the GUI worker thread can catch pipeline panics
# via catch_unwind and show an error dialog instead of silently killing the process.
strip = true
